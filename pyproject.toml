[project]
name = "ragquest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dydxPratik", email = "pratikkumar27075@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "flashrank>=0.2.10",
    "groq>=1.7.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[project.scripts]
ragquest = "src.cli:main"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
